id = "tsrs"
name = "TSRS Language Server"
description = "TypeScript and JavaScript language server powered by tsrs"
version = "0.1.0"
schema_version = 1
authors = ["Luan Roger <luan.roger.2003@gmail.com>"]
repository = "https://github.com/LuanRoger/zed-tsrs"

[language_servers.tsrs]
languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
opt_in_languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
language_ids = { TypeScript = "typescript", TSX = "typescriptreact", JavaScript = "javascript", JSX = "javascriptreact" }
